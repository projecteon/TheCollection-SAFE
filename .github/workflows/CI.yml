name: Continuous Integration Action

on:
  push:
    branches-ignore: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: CI Build & Test
    runs-on: windows-latest

    strategy:
      matrix:
        os: [windows-latest]
        node-version: [20.x]
        dotnet: [ '10.0.x' ]

    steps:
    - name: Install MS SQL local db
      uses: potatoqualitee/mssqlsuite@v1.12
      with:
        install: localdb
        version: 2022
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Setup .NET ${{ matrix.dotnet }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet }}
    - name: Install Dotnet Tools
      run: dotnet tool restore
    - name: Run migrations
      run:  dotnet run RunMigrations --project .\devops\Build\Build.fsproj
    - name: Build application
      run: dotnet run Build --project .\devops\Build\Build.fsproj
