<!doctype html>
<html class="has-navbar-fixed-top">
<head>
  <title>Tea Collection</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#688a08">
  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="/Images/tea_favicon.png" />
</head>
<body>
  <div id="elmish-app"></div>
  <!-- Fable compiles App.fs -> output/App.js (the `-o output` flag); Vite bundles
       from this entry. App.fs runs Program.run and mounts #elmish-app. -->
  <script type="module" src="/output/App.js"></script>
  <script>
    if (navigator.serviceWorker.controller) {
      console.log('[PWA Builder] active service worker found, no need to register')
    } else {
      //Register the ServiceWorker
      navigator.serviceWorker.register('./ServiceWorker.js', {
        scope: './'
      }).then(function(reg) {
        console.log('Service worker has been registered for scope:'+ reg.scope);
      });
    }
  </script>
  <noscript>
    <h1>You don’t have javascript enabled.</h1>
    <p>Please enable it to get the full experience.</p>
  </noscript>
</body>
</html>
